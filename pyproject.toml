[project]
name = "omscs-prep"
version = "0.1.0"
description = "Prep work for Georgia Tech's OMSCS (Machine Learning specialization) — math, algorithms, and ML fundamentals ahead of Spring 2027."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]
